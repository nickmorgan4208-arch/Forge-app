<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Forge — Cinematic Engine Demo</title>
<style>
/*
  CINEMATIC IMAGE ENGINE — animates flat raster images (PNG/JPG/SVG) with:
  2.5D depth-parallax camera rig, Ken Burns push-in, autonomous drift,
  pointer + scroll dolly, ember particles, god rays, film grain, letterbox.
  Swap the data-URI layers below for your own PNG files (cut into 3-4 depth
  layers with any free background-remover) — the engine doesn't care.
*/
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:#050508;color:#f0f0ff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
body{height:340vh;} /* scroll runway drives the dolly */
.stage{position:fixed;inset:0;overflow:hidden;perspective:900px;}
.rig{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform;}
.layer{position:absolute;inset:-12%;width:124%;height:124%;object-fit:cover;will-change:transform;}
canvas.fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;}
#grain{opacity:.07;mix-blend-mode:overlay;}
.ray{position:fixed;top:-20%;width:34vw;height:130vh;pointer-events:none;mix-blend-mode:screen;filter:blur(18px);opacity:0;animation:rayIn 3s 1.2s ease forwards;}
.ray.r1{left:56%;background:linear-gradient(115deg,transparent 20%,rgba(180,210,255,.16) 50%,transparent 80%);transform:rotate(14deg);}
.ray.r2{left:66%;width:20vw;background:linear-gradient(115deg,transparent 25%,rgba(180,210,255,.10) 50%,transparent 75%);transform:rotate(19deg);animation-delay:1.8s;}
@keyframes rayIn{to{opacity:1;}}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,transparent 46%,rgba(0,0,0,.62) 100%);}
.bar{position:fixed;left:0;right:0;height:7vh;background:#000;z-index:40;}
.bar.top{top:0;box-shadow:0 2px 18px rgba(0,0,0,.9);}
.bar.bot{bottom:0;box-shadow:0 -2px 18px rgba(0,0,0,.9);}
.title-wrap{position:fixed;left:0;right:0;top:38%;text-align:center;z-index:30;will-change:transform,opacity;}
.title{font-size:clamp(64px,13vw,150px);font-weight:800;letter-spacing:.34em;text-indent:.34em;color:#e8ff47;text-shadow:0 0 60px rgba(232,255,71,.45),0 0 140px rgba(232,255,71,.25);opacity:0;filter:blur(14px);animation:titleIn 2.6s .8s cubic-bezier(.16,.84,.32,1) forwards;}
.sub{font-size:clamp(11px,1.6vw,15px);letter-spacing:.5em;text-indent:.5em;text-transform:uppercase;color:rgba(240,240,255,.75);margin-top:14px;opacity:0;animation:subIn 2s 2.4s ease forwards;}
@keyframes titleIn{to{opacity:1;filter:blur(0);letter-spacing:.12em;text-indent:.12em;}}
@keyframes subIn{to{opacity:1;}}
.hint{position:fixed;bottom:9vh;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:rgba(240,240,255,.45);z-index:30;opacity:0;animation:subIn 1.5s 3.4s ease forwards;}
.hint::after{content:'';display:block;width:1px;height:26px;background:linear-gradient(rgba(240,240,255,.5),transparent);margin:10px auto 0;animation:drop 1.8s ease infinite;}
@keyframes drop{0%{transform:scaleY(0);transform-origin:top}55%{transform:scaleY(1);transform-origin:top}56%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
.reveal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:30;text-align:center;max-width:640px;padding:0 24px;opacity:0;pointer-events:none;}
.reveal h2{font-size:clamp(26px,4.5vw,44px);font-weight:800;line-height:1.25;text-wrap:balance;}
.reveal h2 em{color:#e8ff47;font-style:normal;}
.reveal p{margin-top:16px;color:rgba(240,240,255,.7);font-size:15px;line-height:1.7;}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;animation-delay:0s !important;}.title{opacity:1;filter:none;}.sub,.hint{opacity:1;}}
</style>
</head>
<body>
<div class="stage"><div class="rig" id="rig"></div></div>
<div class="ray r1"></div><div class="ray r2"></div>
<canvas class="fx" id="embers"></canvas>
<div class="vignette"></div>
<canvas class="fx" id="grain"></canvas>
<div class="bar top"></div><div class="bar bot"></div>
<div class="title-wrap" id="titleWrap"><div class="title">FORGE</div><div class="sub">Real skills · Real life</div></div>
<div class="hint" id="hint">Scroll</div>
<div class="reveal" id="reveal">
  <h2>Every skill they never taught you.<br/><em>One challenge a day.</em></h2>
  <p>Money. Credit. Business. AI. A mentor built around you that grows as you do.</p>
</div>

<script>
// ── LAYER ART ────────────────────────────────────────────────────────────────
// Each layer is a raster <img>. Here they're generated SVG data-URIs so the
// demo is self-contained; in production, point src at your PNG cut into
// layers. depth: 0 = infinitely far, 1 = right at the lens.
const svg = (body) => 'data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">' + body + '</svg>');

const stars = Array.from({length: 90}, () =>
  `<circle cx="${(Math.random()*1600).toFixed(0)}" cy="${(Math.random()*560).toFixed(0)}" r="${(Math.random()*1.4+.3).toFixed(1)}" fill="white" opacity="${(Math.random()*.7+.15).toFixed(2)}"/>`).join('');

const LAYERS = [
  { depth: .06, src: svg(`
    <defs><radialGradient id="sky" cx="62%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#1b2140"/><stop offset="45%" stop-color="#10142c"/><stop offset="100%" stop-color="#07070f"/></radialGradient></defs>
    <rect width="1600" height="900" fill="url(#sky)"/>${stars}
    <circle cx="1050" cy="200" r="95" fill="#dfe8ff" opacity=".95"/>
    <circle cx="1050" cy="200" r="150" fill="none" stroke="#dfe8ff" stroke-width="60" opacity=".08"/>
    <circle cx="1050" cy="200" r="240" fill="none" stroke="#dfe8ff" stroke-width="90" opacity=".04"/>`) },
  { depth: .16, src: svg(`
    <g fill="#141631">
      <path d="M0 640 L140 480 L260 590 L420 430 L560 600 L720 470 L900 620 L1060 500 L1240 640 L1400 520 L1600 630 L1600 900 L0 900 Z"/>
    </g>
    <g fill="#101226" opacity=".9">
      <rect x="1180" y="540" width="26" height="120"/><rect x="1225" y="500" width="34" height="160"/><rect x="1280" y="560" width="22" height="100"/>
      <rect x="330" y="520" width="30" height="140"/><rect x="375" y="560" width="20" height="100"/>
    </g>`) },
  { depth: .38, src: svg(`
    <g fill="#0b0c1a">
      <path d="M0 760 L0 620 L180 620 L200 560 L340 560 L360 620 L520 620 L520 760 Z"/>
      <path d="M540 760 L540 580 L600 580 L600 540 L660 470 L720 540 L720 580 L860 580 L860 760 Z"/>
      <rect x="880" y="600" width="720" height="200"/>
      <path d="M950 600 L950 520 L990 520 L990 600 Z M1060 600 L1060 490 L1105 490 L1105 600 Z"/>
    </g>
    <g>
      <rect x="600" y="600" width="46" height="60" fill="#ff9a3d" opacity=".9"><animate attributeName="opacity" values=".9;.55;.8;.95;.6;.9" dur="3.1s" repeatCount="indefinite"/></rect>
      <rect x="700" y="620" width="30" height="40" fill="#ffb347" opacity=".7"><animate attributeName="opacity" values=".7;.4;.65;.8;.45;.7" dur="2.3s" repeatCount="indefinite"/></rect>
      <rect x="1140" y="640" width="26" height="34" fill="#ff9a3d" opacity=".55"><animate attributeName="opacity" values=".55;.3;.5;.65;.35;.55" dur="2.8s" repeatCount="indefinite"/></rect>
      <ellipse cx="660" cy="640" rx="180" ry="90" fill="#ff8c2e" opacity=".10"/>
    </g>`) },
  { depth: .72, src: svg(`
    <g fill="#020208">
      <path d="M0 900 L0 780 Q200 740 400 764 Q560 780 700 760 Q900 736 1100 768 Q1350 800 1600 772 L1600 900 Z"/>
      <g transform="translate(760,588)">
        <rect x="36" y="96" width="72" height="26" rx="6"/>
        <path d="M22 96 L122 96 L112 76 L86 76 L80 62 L60 62 L54 76 L32 76 Z"/>
        <circle cx="34" cy="6" r="17"/>
        <path d="M22 22 Q10 60 26 96 L58 96 Q50 58 46 26 Z"/>
        <path d="M44 30 L88 -14 L98 -4 L56 40 Z"/>
        <rect x="84" y="-26" width="26" height="18" rx="4" transform="rotate(45 97 -17)"/>
      </g>
      <ellipse cx="795" cy="712" rx="120" ry="14" opacity=".8"/>
    </g>
    <path d="M818 574 L862 530 L872 540 L830 584 Z" fill="#ffb347" opacity=".28"/>`) },
];

const rig = document.getElementById('rig');
LAYERS.forEach(L => {
  const img = new Image();
  img.src = L.src; img.className = 'layer'; img.dataset.depth = L.depth;
  img.style.transform = 'translateZ(' + (-420 * (1 - L.depth)) + 'px) scale(' + (1 + (1 - L.depth) * .48) + ')';
  rig.appendChild(img);
});

// ── CAMERA RIG ───────────────────────────────────────────────────────────────
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let px = 0, py = 0, tx = 0, ty = 0, t0 = performance.now();
addEventListener('pointermove', e => {
  tx = (e.clientX / innerWidth - .5) * 2;
  ty = (e.clientY / innerHeight - .5) * 2;
});
const titleWrap = document.getElementById('titleWrap');
const hint = document.getElementById('hint');
const reveal = document.getElementById('reveal');
const layers = [...document.querySelectorAll('.layer')];

function frame(now) {
  const t = (now - t0) / 1000;
  const runway = document.body.scrollHeight - innerHeight;
  const s = runway > 0 ? Math.min(1, scrollY / runway) : 0;
  // ease the dolly; autonomous drift so it's alive even untouched
  const drift = reduced ? 0 : 1;
  const dx = Math.sin(t * .21) * 8 * drift, dy = Math.cos(t * .16) * 5 * drift;
  px += (tx - px) * .045; py += (ty - py) * .045;
  const kb = reduced ? 0 : Math.min(1, t / 26);               // Ken Burns push
  const zoom = 1 + kb * .07 + s * .34;                        // + scroll dolly
  layers.forEach(el => {
    const d = +el.dataset.depth;
    const mx = (px * 34 + dx) * d, my = (py * 22 + dy) * d - s * 260 * d;
    el.style.transform =
      'translate3d(' + mx + 'px,' + my + 'px,' + (-420 * (1 - d)) + 'px)' +
      ' scale(' + ((1 + (1 - d) * .48) * zoom) + ')';
  });
  // title exits upward faster than the world (near-layer feel)
  const tp = Math.min(1, s / .35);
  titleWrap.style.transform = 'translateY(' + (-tp * 46 - py * 10) + 'vh)';
  titleWrap.style.opacity = String(1 - tp);
  hint.style.opacity = s > .04 ? '0' : '';
  // reveal card fades in mid-scroll
  const rp = Math.max(0, Math.min(1, (s - .45) / .25));
  reveal.style.opacity = String(rp);
  reveal.style.transform = 'translate(-50%,-50%) translateY(' + ((1 - rp) * 40) + 'px)';
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ── EMBERS ───────────────────────────────────────────────────────────────────
const ec = document.getElementById('embers'), ex = ec.getContext('2d');
function sizeCanvas(c) { c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio; }
sizeCanvas(ec); addEventListener('resize', () => { sizeCanvas(ec); sizeCanvas(gc); });
const embers = Array.from({length: reduced ? 0 : 46}, () => spawn(true));
function spawn(anywhere) {
  return { x: (0.35 + Math.random() * .35) * ec.width, y: anywhere ? Math.random() * ec.height : ec.height + 10,
    vx: (Math.random() - .4) * .35, vy: -(.35 + Math.random() * .85), r: (Math.random() * 2.2 + .8) * devicePixelRatio,
    life: Math.random(), hue: 24 + Math.random() * 18 };
}
(function emberLoop() {
  ex.clearRect(0, 0, ec.width, ec.height);
  embers.forEach((p, i) => {
    p.x += p.vx * devicePixelRatio + Math.sin(p.y * .01) * .3; p.y += p.vy * devicePixelRatio; p.life -= .0035;
    if (p.life <= 0 || p.y < -12) { embers[i] = spawn(false); return; }
    ex.beginPath(); ex.arc(p.x, p.y, Math.max(0, p.r * p.life), 0, 7);
    ex.fillStyle = 'hsla(' + p.hue + ',100%,62%,' + (p.life * .8) + ')';
    ex.shadowColor = 'hsla(' + p.hue + ',100%,60%,.9)'; ex.shadowBlur = 12 * p.life;
    ex.fill(); ex.shadowBlur = 0;
  });
  requestAnimationFrame(emberLoop);
})();

// ── FILM GRAIN ───────────────────────────────────────────────────────────────
const gc = document.getElementById('grain'), gx = gc.getContext('2d');
sizeCanvas(gc);
(function grainLoop() {
  if (!reduced) {
    const w = 160, h = 90, id = gx.createImageData(w, h);
    for (let i = 0; i < id.data.length; i += 4) { const v = Math.random() * 255 | 0; id.data[i] = id.data[i+1] = id.data[i+2] = v; id.data[i+3] = 34; }
    const off = document.createElement('canvas'); off.width = w; off.height = h;
    off.getContext('2d').putImageData(id, 0, 0);
    gx.imageSmoothingEnabled = false;
    gx.clearRect(0, 0, gc.width, gc.height);
    gx.drawImage(off, 0, 0, gc.width, gc.height);
  }
  setTimeout(() => requestAnimationFrame(grainLoop), 70);
})();
</script>
</body>
</html>
