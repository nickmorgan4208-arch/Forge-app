  <style>


*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#080810;--s1:#10101c;--s2:#18182a;--s3:#22223a;--border:#2a2a42;--accent:#e8ff47;--blue:#47c8ff;--red:#ff6b47;--green:#47ffaa;--purple:#c847ff;--text:#f0f0ff;--muted:#7070a0;--r:18px;}
html,body{height:100%;background:#080810 !important;color:var(--text);font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased;}body{background:#080810 !important;}
input,button,textarea{font-family:'DM Sans',sans-serif;}
button{cursor:pointer;}
.root{min-height:100vh;display:flex;flex-direction:column;max-width:540px;margin:0 auto;position:relative;background:#080810;}
.screen{flex:1;display:flex;flex-direction:column;padding:24px 20px 100px;animation:fadeUp .4s ease both;}
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:540px;background:rgba(8,8,16,.94);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;z-index:100;}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px 22px;border:none;background:none;color:var(--muted);font-size:10px;letter-spacing:.06em;text-transform:uppercase;transition:color .2s;}
.bnav-btn.active{color:var(--accent);}
.bnav-icon{font-size:24px;line-height:1;}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;}
.wordmark{font-family:'Syne',sans-serif;font-weight:800;font-size:28px;color:var(--accent);letter-spacing:-1px;}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--blue));display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:16px;color:#080810;}
.login-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;background:#080810;}
.login-logo{font-family:'Syne',sans-serif;font-weight:800;font-size:64px;color:var(--accent);letter-spacing:-3px;margin-bottom:6px;}
.login-tag{font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-bottom:52px;text-align:center;}
.login-box{width:100%;max-width:380px;}
.field{margin-bottom:16px;}
.field-label{display:block;font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;}
.field-input{width:100%;background:var(--s2);border:1.5px solid var(--border);border-radius:14px;padding:18px 18px;color:var(--text);font-size:18px;outline:none;transition:border-color .2s;-webkit-appearance:none;}
.field-input:focus{border-color:var(--accent);}
.field-input::placeholder{color:var(--muted);}
.btn-main{width:100%;background:var(--accent);color:#080810;font-family:'Syne',sans-serif;font-weight:700;font-size:17px;letter-spacing:.04em;border:none;border-radius:14px;padding:20px;margin-top:8px;transition:all .2s;text-transform:uppercase;}
.btn-main:hover{transform:translateY(-1px);box-shadow:0 8px 28px rgba(232,255,71,.3);}
.btn-main:disabled{opacity:.5;transform:none;box-shadow:none;}
.err{font-size:14px;color:var(--red);margin-top:12px;text-align:center;}
.parent-link{margin-top:32px;text-align:center;}
.parent-link button{background:none;border:none;color:var(--muted);font-size:14px;text-decoration:underline;padding:8px;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px;}
.stat{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:20px 12px;text-align:center;position:relative;overflow:hidden;}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--c,var(--accent));}
.stat-val{font-family:'Syne',sans-serif;font-weight:800;font-size:32px;color:var(--c,var(--accent));line-height:1;margin-bottom:4px;}
.stat-lbl{font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;}
.streak-row{display:flex;gap:8px;margin-bottom:28px;}
.sdot{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .3s;}
.sdot.done{background:rgba(232,255,71,.15);border-color:var(--accent);}
.sdot.today{border-color:var(--blue);animation:pulse 2s ease infinite;}
.sec{font-family:'Syne',sans-serif;font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;}
.ccard{background:var(--s1);border:1px solid var(--border);border-radius:20px;overflow:hidden;margin-bottom:24px;}
.ccard-head{padding:22px 20px 18px;background:linear-gradient(135deg,rgba(232,255,71,.07),transparent);border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.ccard-skill{font-size:11px;color:var(--accent);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;}
.ccard-title{font-family:'Syne',sans-serif;font-weight:700;font-size:24px;line-height:1.2;}
.ccard-icon{font-size:36px;flex-shrink:0;margin-top:4px;}
.ccard-body{padding:22px;}
.ccard-text{font-size:16px;line-height:1.75;color:#c0c0d8;margin-bottom:22px;}
.task-box{background:var(--s2);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:22px;}
.task-lbl{font-size:10px;color:var(--blue);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;}
.task-text{font-size:16px;line-height:1.75;}
.ccard-actions{display:flex;gap:10px;}
.btn-complete{flex:1;background:var(--accent);color:#080810;font-family:'Syne',sans-serif;font-weight:700;font-size:16px;letter-spacing:.04em;text-transform:uppercase;border:none;border-radius:14px;padding:18px;transition:all .2s;}
.btn-complete:hover{box-shadow:0 6px 20px rgba(232,255,71,.3);transform:translateY(-1px);}
.btn-complete:disabled{opacity:.5;transform:none;box-shadow:none;}
.btn-skip{background:var(--s2);border:1.5px solid var(--border);color:var(--muted);font-size:22px;border-radius:14px;padding:18px 22px;transition:all .2s;}
.btn-skip:hover{border-color:var(--blue);color:var(--blue);}
.loading{text-align:center;padding:52px 24px;color:var(--muted);font-size:13px;letter-spacing:.08em;}
.spinner{width:30px;height:30px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;margin:0 auto 18px;animation:spin .8s linear infinite;}
.done-state{text-align:center;padding:52px 24px;}
.done-icon{font-size:64px;margin-bottom:18px;animation:pop .4s cubic-bezier(.34,1.56,.64,1) both;}
.done-title{font-family:'Syne',sans-serif;font-weight:800;font-size:28px;color:var(--accent);margin-bottom:8px;}
.done-sub{font-size:15px;color:var(--muted);margin-bottom:32px;}
.btn-next{background:var(--s2);border:1.5px solid var(--accent);color:var(--accent);font-family:'Syne',sans-serif;font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;border-radius:14px;padding:16px 36px;transition:all .2s;}
.btn-next:hover{background:rgba(232,255,71,.1);}
.skill-list{display:flex;flex-direction:column;gap:12px;}
.skill-item{background:var(--s1);border:1.5px solid var(--border);border-radius:var(--r);padding:20px 16px;display:flex;align-items:center;gap:14px;transition:all .2s;}
.skill-item.active{border-color:var(--accent);background:rgba(232,255,71,.04);}
.skill-item.locked{opacity:.4;}
.skill-emoji{font-size:30px;flex-shrink:0;}
.skill-info{flex:1;}
.skill-name{font-family:'Syne',sans-serif;font-weight:700;font-size:17px;margin-bottom:3px;}
.skill-desc{font-size:13px;color:var(--muted);}
.skill-badge{font-size:10px;padding:6px 14px;border-radius:20px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;flex-shrink:0;}
.badge-active{background:rgba(232,255,71,.15);color:var(--accent);}
.badge-done{background:rgba(71,255,170,.15);color:var(--green);}
.badge-locked{background:var(--s2);color:var(--muted);}
.prog-empty{text-align:center;padding:52px 24px;color:var(--muted);font-size:15px;line-height:1.7;}
.prog-item{background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:10px;}
.prog-skill{font-size:10px;color:var(--accent);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px;}
.prog-title{font-size:16px;font-weight:500;margin-bottom:4px;}
.prog-date{font-size:13px;color:var(--muted);}
.pin-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:32px 24px;background:var(--bg);}
.pin-title{font-family:'Syne',sans-serif;font-weight:800;font-size:32px;margin-bottom:8px;}
.pin-sub{font-size:15px;color:var(--muted);margin-bottom:36px;}
.pin-dots{display:flex;gap:16px;margin-bottom:36px;}
.pin-dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);transition:all .2s;}
.pin-dot.filled{background:var(--blue);border-color:var(--blue);}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%;max-width:300px;}
.pin-key{background:var(--s2);border:1.5px solid var(--border);border-radius:18px;padding:22px;font-family:'Syne',sans-serif;font-weight:700;font-size:24px;text-align:center;border:1.5px solid var(--border);transition:all .15s;}
.pin-key:active{background:var(--s3);transform:scale(.94);}
.pin-key.del{font-size:18px;color:var(--muted);}
.parent-screen{min-height:100vh;background:var(--bg);padding:32px 20px 48px;max-width:540px;margin:0 auto;}
.parent-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px;}
.parent-wordmark{font-family:'Syne',sans-serif;font-weight:800;font-size:26px;color:var(--blue);}
.parent-sub{font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;}
.p-card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:16px;}
.p-card-title{font-family:'Syne',sans-serif;font-weight:700;font-size:16px;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.p-stat-row{display:flex;gap:10px;margin-bottom:14px;}
.p-stat{flex:1;background:var(--s2);border-radius:12px;padding:14px 10px;text-align:center;}
.p-stat-val{font-family:'Syne',sans-serif;font-weight:800;font-size:26px;color:var(--accent);}
.p-stat-lbl{font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;}
.p-feed-item{padding:12px 0;border-bottom:1px solid var(--border);}
.p-feed-item:last-child{border-bottom:none;}
.p-feed-skill{font-size:10px;color:var(--blue);letter-spacing:.08em;text-transform:uppercase;}
.p-feed-title{font-weight:500;margin:3px 0;font-size:15px;}
.p-feed-date{font-size:13px;color:var(--muted);}
.p-textarea{width:100%;background:var(--s2);border:1.5px solid var(--border);border-radius:12px;padding:16px;color:var(--text);font-size:16px;resize:none;outline:none;transition:border-color .2s;min-height:110px;}
.p-textarea:focus{border-color:var(--blue);}
.btn-parent{background:var(--blue);color:#080810;font-family:'Syne',sans-serif;font-weight:700;font-size:15px;letter-spacing:.04em;text-transform:uppercase;border:none;border-radius:12px;padding:15px 24px;transition:all .2s;margin-top:10px;}
.btn-parent:hover{box-shadow:0 6px 20px rgba(71,200,255,.3);}
.btn-parent:disabled{opacity:.5;}
.btn-ghost-sm{background:none;border:1px solid var(--border);color:var(--muted);font-size:13px;border-radius:8px;padding:8px 16px;transition:all .2s;}
.btn-ghost-sm:hover{border-color:var(--muted);color:var(--text);}
.ai-messages{max-height:300px;overflow-y:auto;margin-bottom:12px;display:flex;flex-direction:column;gap:10px;padding-right:4px;}
.ai-msg{padding:14px 16px;border-radius:14px;font-size:14px;line-height:1.65;}
.ai-msg.user{background:rgba(232,255,71,.1);border:1px solid rgba(232,255,71,.2);align-self:flex-end;max-width:85%;}
.ai-msg.assistant{background:var(--s2);border:1px solid var(--border);align-self:flex-start;max-width:92%;}
.ai-input-row{display:flex;gap:8px;}
.ai-input{flex:1;background:var(--s2);border:1.5px solid var(--border);border-radius:12px;padding:14px 16px;color:var(--text);font-size:15px;outline:none;}
.ai-input:focus{border-color:var(--blue);}
.btn-send{background:var(--blue);color:#080810;border:none;border-radius:12px;padding:14px 18px;font-size:20px;transition:all .2s;}
.btn-send:disabled{opacity:.4;}
.unlock-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border);}
.unlock-row:last-child{border-bottom:none;}
.unlock-skill{display:flex;align-items:center;gap:10px;font-size:15px;}
.unlock-btn{background:rgba(71,255,170,.15);color:var(--green);border:1px solid var(--green);font-size:12px;border-radius:8px;padding:7px 16px;font-weight:600;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(71,200,255,.4)}50%{box-shadow:0 0 0 8px rgba(71,200,255,0)}}

  },
  async updateUser(id, fields) {
    await fetch(`${SUPABASE_URL}/rest/v1/users?id=eq.${id}`, { method: "PATCH", headers: this.h, body: JSON.stringify(fields) });
  },
  async logCompletion(userId, skillId, title) {
    await fetch(`${SUPABASE_URL}/rest/v1/completions`, { method: "POST", headers: this.h, body: JSON.stringify({ user_id: userId, skill_id: skillId, challenge_title: title }) });
  }
};



function ForgeApp() {
  const [mode, setMode] = useState("login");
  return (
    <>
      
      <div className="root">
        {mode === "login"   && <LoginScreen onStudent={()=>setMode("student")} onParent={()=>setMode("pin")} />}
        {mode === "student" && <StudentApp onExit={()=>setMode("login")} />}
        {mode === "pin"     && <PinScreen onSuccess={()=>setMode("parent")} onBack={()=>setMode("login")} />}
        {mode === "parent"  && <ParentPortal onExit={()=>setMode("login")} />}
      </div>
    </>
  );
}

function LoginScreen({ onStudent, onParent }) {
  const [name, setName]         = useState("");
  const [pass, setPass]         = useState("");
  const [showPass, setShowPass] = useState(false);
  const [err, setErr]           = useState("");
  const [loading, setLoading]   = useState(false);

  const handleLogin = async () => {
    if (!name.trim()) { setErr("Enter your name."); return; }
    if (!pass.trim()) { setErr("Enter your password."); return; }
    setLoading(true); setErr("");
    try {
      const u = await db.getUser(name.trim(), pass);
      if (u) { onStudent(); setLoading(false); return; }
    } catch {}
    if (name.trim().toLowerCase() === LOCAL_STUDENT.name.toLowerCase() && pass === LOCAL_STUDENT.password) {
      onStudent(); setLoading(false); return;
    }
    setErr("Wrong name or password."); setLoading(false);
  };

  return (
    <div className="login-screen">
      <div className="login-logo">FORGE</div>
      <div className="login-tag">Build things that didn't exist yesterday</div>
      <div className="login-box">
        <div className="field">
          <label className="field-label">Your name</label>
          <input className="field-input" placeholder="Type your name..." value={name}
            autoComplete="off" autoCorrect="off" autoCapitalize="words" spellCheck="false"
            onChange={e=>{ setName(e.target.value); setErr(""); if(e.target.value.trim()) setShowPass(true); else setShowPass(false); }} />
        </div>
        {showPass && (
          <div className="field" style={{animation:"fadeUp .3s ease both"}}>
            <label className="field-label">Password</label>
            <input className="field-input" type="password" placeholder="Enter password" value={pass}
              autoComplete="new-password"
              onChange={e=>{ setPass(e.target.value); setErr(""); }}
              onKeyDown={e=>e.key==="Enter"&&handleLogin()} />
          </div>
        )}
        {err && <div className="err">{err}</div>}
        {showPass && (
          <button className="btn-main" onClick={handleLogin} disabled={loading}>
            {loading ? "Checking..." : "Enter Forge →"}
          </button>
        )}
        <div className="parent-link">
          <button onClick={onParent}>Parent access</button>
        </div>
      </div>
    </div>
  );
}

function StudentApp({ onExit }) {
  const [tab, setTab]             = useState("home");
  const [streak, setStreak]       = useState(0);
  const [completed, setCompleted] = useState(0);
  const [level, setLevel]         = useState(0);
  const [challenge, setChallenge] = useState(null);
  const [loading, setLoading]     = useState(false);
  const [done, setDone]           = useState(false);
  const [history, setHistory]     = useState([]);

  useEffect(()=>{ loadChallenge(0); },[]);

  const loadChallenge = async (lvl) => {
    setLoading(true); setChallenge(null); setDone(false);
    const skill = SKILL_LADDER[lvl];
    const prompt = `You are a coding teacher for a 10-year-old girl named Carley who is a complete beginner. Generate a fresh daily challenge for: "${skill.name}". Respond ONLY with JSON no markdown: {"title":"max 5 words","explanation":"2-3 sentences simple warm not babyish","task":"specific task achievable in 10-15 minutes"}`;
    try {
      const r = await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:600,messages:[{role:"user",content:prompt}]})});
      const d = await r.json();
      const t = d.content?.find(b=>b.type==="text")?.text||"";
      setChallenge(JSON.parse(t.replace(/```json|```/g,"").trim()));
    } catch {
      setChallenge({title:"What Even Is AI?",explanation:"AI stands for Artificial Intelligence — a computer program that learns from examples, kind of like how you learned to recognize dogs by seeing lots of them.",task:"Grab a piece of paper and list 3 things you think AI can do well and 3 things you think it can't. Keep it — you'll look back at this list later."});
    }
    setLoading(false);
  };

  const handleComplete = async () => {
    setDone(true);
    const ns=streak+1; const nc=completed+1;
    setStreak(ns); setCompleted(nc);
    setHistory(h=>[{skill:SKILL_LADDER[level].name,title:challenge?.title||"",date:new Date().toLocaleDateString()},...h]);
    try { await db.updateUser(LOCAL_STUDENT.id,{streak:ns,completed:nc,level,last_active:new Date().toISOString().split("T")[0]}); } catch{}
  };

  const streakDots = Array.from({length:7},(_,i)=>i<(streak%7)?"done":i===(streak%7)?"today":"empty");
  const tabs = [{id:"home",icon:"🏠",label:"Home"},{id:"challenge",icon:"⚡",label:"Challenge"},{id:"progress",icon:"📈",label:"Progress"},{id:"skills",icon:"🎯",label:"Skills"}];

  return (
    <>
      {tab==="home" && (
        <div className="screen">
          <div className="topbar">
            <div className="wordmark">FORGE</div>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <div className="avatar">C</div>
              <button className="btn-ghost-sm" onClick={onExit}>exit</button>
            </div>
          </div>
          <div className="stats">
            <div className="stat" style={{"--c":"var(--accent)"}}><div className="stat-val">{streak}</div><div className="stat-lbl">Streak 🔥</div></div>
            <div className="stat" style={{"--c":"var(--blue)"}}><div className="stat-val">{completed}</div><div className="stat-lbl">Done</div></div>
            <div className="stat" style={{"--c":"var(--red)"}}><div className="stat-val">{level+1}/6</div><div className="stat-lbl">Level</div></div>
          </div>
          <div className="sec">This week</div>
          <div className="streak-row">{streakDots.map((t,i)=><div key={i} className={`sdot ${t}`}>{t==="done"?"✓":t==="today"?"→":""}</div>)}</div>
          <div className="sec">Current skill</div>
          <div className="skill-item active" style={{marginBottom:0}}>
            <div className="skill-emoji">{SKILL_LADDER[level].icon}</div>
            <div className="skill-info"><div className="skill-name">{SKILL_LADDER[level].name}</div><div className="skill-desc">{SKILL_LADDER[level].desc}</div></div>
            <button className="skill-badge badge-active" onClick={()=>setTab("challenge")}>Go →</button>
          </div>
        </div>
      )}

      {tab==="challenge" && (
        <div className="screen">
          <div className="topbar"><div className="wordmark">FORGE</div><div className="avatar">C</div></div>
          <div className="ccard">
            {loading && <div className="loading"><div className="spinner"/>generating your challenge...</div>}
            {!loading&&done && (
              <div className="done-state">
                <div className="done-icon">⚡</div>
                <div className="done-title">Challenge Complete!</div>
                <div className="done-sub">Day streak: {streak} 🔥</div>
                <button className="btn-next" onClick={()=>{const n=Math.min(level+1,5);setLevel(n);loadChallenge(n);}}>Next Challenge →</button>
              </div>
            )}
            {!loading&&!done&&challenge && (
              <>
                <div className="ccard-head">
                  <div><div className="ccard-skill">{SKILL_LADDER[level].name} · Day {completed+1}</div><div className="ccard-title">{challenge.title}</div></div>
                  <div className="ccard-icon">{SKILL_LADDER[level].icon}</div>
                </div>
                <div className="ccard-body">
                  <div className="ccard-text">{challenge.explanation}</div>
                  <div className="task-box"><div className="task-lbl">Your task today</div><div className="task-text">{challenge.task}</div></div>
                  <div className="ccard-actions">
                    <button className="btn-complete" onClick={handleComplete}>Mark Complete ✓</button>
                    <button className="btn-skip" onClick={()=>loadChallenge(level)} disabled={loading}>↺</button>
                  </div>
                </div>
              </>
            )}
          </div>
        </div>
      )}

      {tab==="progress" && (
        <div className="screen">
          <div className="topbar"><div className="wordmark">FORGE</div><div className="avatar">C</div></div>
          <div className="sec">Completed challenges</div>
          {history.length===0
            ? <div className="prog-empty">No challenges completed yet.<br/>Start with today's challenge! ⚡</div>
            : history.map((h,i)=><div key={i} className="prog-item"><div className="prog-skill">{h.skill}</div><div className="prog-title">{h.title}</div><div className="prog-date">{h.date}</div></div>)
          }
        </div>
      )}

      {tab==="skills" && (
        <div className="screen">
          <div className="topbar"><div className="wordmark">FORGE</div><div className="avatar">C</div></div>
          <div className="sec">Skill ladder</div>
          <div className="skill-list">
            {SKILL_LADDER.map((sk,i)=>{
              const isDone=i<level;const isActive=i===level;const isLocked=i>level;
              return (
                <div key={sk.id} className={`skill-item ${isActive?"active":""} ${isLocked?"locked":""}`} onClick={()=>!isLocked&&(setLevel(i),loadChallenge(i),setTab("challenge"))}>
                  <div className="skill-emoji">{sk.icon}</div>
                  <div className="skill-info"><div className="skill-name">{sk.name}</div><div className="skill-desc">{sk.desc}</div></div>
                  <span className={`skill-badge ${isDone?"badge-done":isActive?"badge-active":"badge-locked"}`}>{isDone?"done":isActive?"active":"locked"}</span>
                </div>
              );
            })}
          </div>
        </div>
      )}

      <nav className="bnav">
        {tabs.map(t=>(
          <button key={t.id} className={`bnav-btn ${tab===t.id?"active":""}`} onClick={()=>setTab(t.id)}>
            <span className="bnav-icon">{t.icon}</span>{t.label}
          </button>
        ))}
      </nav>
    </>
  );
}

function PinScreen({ onSuccess, onBack }) {
  const [pin, setPin] = useState("");
  const [err, setErr] = useState(false);

  const press = (k) => {
    if(k==="del"){setPin(p=>p.slice(0,-1));setErr(false);return;}
    if(pin.length>=4)return;
    const np=pin+k; setPin(np);
    if(np.length===4){
      if(np===PARENT_PIN){setTimeout(onSuccess,200);}
      else{setTimeout(()=>{setPin("");setErr(true);},300);}
    }
  };

  return (
    <div className="pin-screen">
      <div className="pin-title">Parent Access</div>
      <div className="pin-sub" style={{color:err?"var(--red)":"var(--muted)"}}>{err?"Incorrect PIN. Try again.":"Enter your PIN"}</div>
      <div className="pin-dots">{[0,1,2,3].map(i=><div key={i} className={`pin-dot ${i<pin.length?"filled":""}`}/>)}</div>
      <div className="pin-pad">
        {["1","2","3","4","5","6","7","8","9","","0","del"].map((k,i)=>(
          k===""?<div key={i}/>:<button key={i} className={`pin-key ${k==="del"?"del":""}`} onClick={()=>press(k)}>{k==="del"?"⌫":k}</button>
        ))}
      </div>
      <button className="btn-ghost-sm" style={{marginTop:28}} onClick={onBack}>← Back</button>
    </div>
  );
}

function ParentPortal({ onExit }) {
  const [customChallenge, setCustomChallenge] = useState("");
  const [saved, setSaved]                     = useState(false);
  const [unlockedLevel, setUnlockedLevel]     = useState(0);
  const [aiMessages, setAiMessages]           = useState([
    {role:"assistant",content:"Hi! I'm here to help you support Carley's learning. Ask me what she should work on next, how to explain a concept, or ideas for custom challenges based on her current level."}
  ]);
  const [aiInput, setAiInput]   = useState("");
  const [aiLoading, setAiLoading] = useState(false);
  const messagesEndRef = useRef(null);

  const activity = [{skill:"What is AI?",title:"What Even Is AI?",date:"Today"}];

  useEffect(()=>{ messagesEndRef.current?.scrollIntoView({behavior:"smooth"}); },[aiMessages]);

  const sendAi = async () => {
    if(!aiInput.trim()||aiLoading)return;
    const msg = aiInput.trim(); setAiInput("");
    setAiMessages(m=>[...m,{role:"user",content:msg}]);
    setAiLoading(true);
    const sys = `You are a helpful assistant for parents (Nick and Jess) supporting their 10-year-old daughter Carley learning to code and understand AI. She is a complete beginner currently on level ${unlockedLevel+1}/6: "${SKILL_LADDER[unlockedLevel].name}". She has completed ${activity.length} challenge(s). Give practical specific advice. Keep responses concise and parent-friendly.`;
    try {
      const r = await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:500,system:sys,messages:aiMessages.concat({role:"user",content:msg})})});
      const d = await r.json();
      const t = d.content?.find(b=>b.type==="text")?.text||"Couldn't connect right now.";
      setAiMessages(m=>[...m,{role:"assistant",content:t}]);
    } catch {
      setAiMessages(m=>[...m,{role:"assistant",content:"Couldn't connect right now. Try again."}]);
    }
    setAiLoading(false);
  };

  const saveCustom = () => {
    if(!customChallenge.trim())return;
    setSaved(true); setTimeout(()=>setSaved(false),2000); setCustomChallenge("");
  };

  return (
    <div className="parent-screen">
      <div className="parent-header">
        <div><div className="parent-wordmark">FORGE</div><div className="parent-sub">Parent Portal</div></div>
        <button className="btn-ghost-sm" onClick={onExit}>exit</button>
      </div>

      <div className="p-card">
        <div className="p-card-title">📊 Carley's Progress</div>
        <div className="p-stat-row">
          <div className="p-stat"><div className="p-stat-val">0</div><div className="p-stat-lbl">Streak</div></div>
          <div className="p-stat"><div className="p-stat-val">{activity.length}</div><div className="p-stat-lbl">Done</div></div>
          <div className="p-stat"><div className="p-stat-val">{unlockedLevel+1}/6</div><div className="p-stat-lbl">Level</div></div>
        </div>
        <div style={{fontSize:14,color:"var(--muted)"}}>Current skill: <span style={{color:"var(--accent)"}}>{SKILL_LADDER[unlockedLevel].name}</span></div>
      </div>

      <div className="p-card">
        <div className="p-card-title">🕐 Recent Activity</div>
        {activity.map((a,i)=>(
          <div key={i} className="p-feed-item">
            <div className="p-feed-skill">{a.skill}</div>
            <div className="p-feed-title">{a.title}</div>
            <div className="p-feed-date">{a.date}</div>
          </div>
        ))}
      </div>

      <div className="p-card">
        <div className="p-card-title">🔓 Unlock Levels</div>
        {SKILL_LADDER.map((sk,i)=>(
          <div key={sk.id} className="unlock-row">
            <div className="unlock-skill"><span>{sk.icon}</span><span>{sk.name}</span></div>
            {i<=unlockedLevel
              ? <span style={{fontSize:13,color:"var(--green)"}}>✓ Unlocked</span>
              : i===unlockedLevel+1
                ? <button className="unlock-btn" onClick={()=>setUnlockedLevel(i)}>Unlock</button>
                : <span style={{fontSize:13,color:"var(--muted)"}}>Locked</span>
            }
          </div>
        ))}
      </div>

      <div className="p-card">
        <div className="p-card-title">✏️ Add Custom Challenge</div>
        <textarea className="p-textarea" placeholder="Write a custom challenge for Carley to see next time she logs in..." value={customChallenge} onChange={e=>setCustomChallenge(e.target.value)}/>
        <button className="btn-parent" onClick={saveCustom} disabled={!customChallenge.trim()}>{saved?"Saved ✓":"Save Challenge"}</button>
      </div>

      <div className="p-card">
        <div className="p-card-title">🤖 AI Assistant</div>
        <div className="ai-messages">
          {aiMessages.map((m,i)=><div key={i} className={`ai-msg ${m.role}`}>{m.content}</div>)}
          {aiLoading&&<div className="ai-msg assistant" style={{color:"var(--muted)"}}>thinking...</div>}
          <div ref={messagesEndRef}/>
        </div>
        <div className="ai-input-row">
          <input className="ai-input" placeholder="Ask about Carley's learning..." value={aiInput} onChange={e=>setAiInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&sendAi()}/>
          <button className="btn-send" onClick={sendAi} disabled={!aiInput.trim()||aiLoading}>→</button>
        </div>
      </div>
    </div>
  );
}

const domRoot = ReactDOM.createRoot(document.getElementById('root'));
domRoot.render(React.createElement(ForgeApp));
  </script>
