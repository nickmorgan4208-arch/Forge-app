<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
  <title>Forge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#080810;--s1:#10101c;--s2:#18182a;--s3:#22223a;--border:#2a2a42;--accent:#e8ff47;--blue:#47c8ff;--red:#ff6b47;--green:#47ffaa;--purple:#c847ff;--orange:#ffaa47;--text:#f0f0ff;--muted:#9a9ac4;--r:18px;}
html,body{height:100%;background:#080810 !important;color:var(--text);font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased;}body{background:#080810 !important;}
/* Living aurora backdrop — subtle drifting color fields behind everything */
body::before{content:'';position:fixed;inset:-10%;pointer-events:none;background:radial-gradient(560px 420px at 82% -6%,rgba(232,255,71,.075),transparent 62%),radial-gradient(520px 400px at -8% 34%,rgba(71,200,255,.07),transparent 62%),radial-gradient(620px 520px at 108% 82%,rgba(200,71,255,.06),transparent 62%);animation:drift 16s ease-in-out infinite alternate;}
@keyframes drift{from{transform:translate3d(-8px,-10px,0) scale(1)}to{transform:translate3d(10px,12px,0) scale(1.06)}}
input,button,textarea{font-family:'DM Sans',sans-serif;}
button{cursor:pointer;}
button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;}}
.root{min-height:100vh;display:flex;flex-direction:column;max-width:540px;margin:0 auto;position:relative;}
.screen{flex:1;display:flex;flex-direction:column;padding:24px 20px 100px;animation:fadeUp .4s ease both;}
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:540px;background:rgba(8,8,16,.94);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;z-index:100;}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px 22px;border:none;background:none;color:var(--muted);font-size:10px;letter-spacing:.06em;text-transform:uppercase;transition:color .2s;}
.bnav-btn.active{color:var(--accent);}
.bnav-icon{font-size:24px;line-height:1;}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;}
.wordmark{font-family:'Syne',sans-serif;font-weight:800;font-size:28px;color:var(--accent);letter-spacing:-1px;text-shadow:0 0 24px rgba(232,255,71,.3);}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--blue));display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:16px;color:#080810;}
.btn-ghost-sm{background:none;border:1px solid var(--border);color:var(--muted);font-size:12px;border-radius:10px;padding:8px 14px;transition:all .2s;}
.btn-ghost-sm:hover{color:var(--text);border-color:var(--muted);}
.login-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;}
.login-logo{font-family:'Syne',sans-serif;font-weight:800;font-size:64px;color:var(--accent);letter-spacing:-3px;margin-bottom:6px;text-shadow:0 0 60px rgba(232,255,71,.4);}
.login-tag{font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-bottom:52px;text-align:center;}
.login-box{width:100%;max-width:380px;}
.field{margin-bottom:16px;}
.field-label{display:block;font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;}
.field-input{width:100%;background:var(--s2);border:1.5px solid var(--border);border-radius:14px;padding:18px 18px;color:var(--text);font-size:18px;outline:none;transition:border-color .2s;-webkit-appearance:none;}
.field-input:focus{border-color:var(--accent);}
.field-input::placeholder{color:var(--muted);}
.btn-main{width:100%;background:var(--accent);color:#080810;font-family:'Syne',sans-serif;font-weight:700;font-size:17px;letter-spacing:.04em;border:none;border-radius:14px;padding:20px;margin-top:8px;transition:all .2s;text-transform:uppercase;box-shadow:0 10px 26px rgba(232,255,71,.16);}
.btn-main:hover{transform:translateY(-1px);box-shadow:0 8px 28px rgba(232,255,71,.3);}
.btn-main:active{transform:scale(.97);}
.btn-main:disabled{opacity:.5;transform:none;box-shadow:none;}
.btn-secondary{width:100%;background:none;border:1.5px solid var(--border);color:var(--muted);font-size:15px;border-radius:14px;padding:16px;margin-top:12px;transition:all .2s;}
.btn-secondary:hover{color:var(--text);border-color:var(--muted);}
.err{font-size:14px;color:var(--red);margin-top:12px;text-align:center;}
.ob-step{font-size:11px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px;}
.ob-q{font-family:'Syne',sans-serif;font-weight:700;font-size:26px;line-height:1.25;margin-bottom:8px;}
.ob-sub{font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:26px;}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:28px;}
.chip{background:var(--s2);border:1.5px solid var(--border);color:var(--text);border-radius:24px;padding:12px 18px;font-size:15px;transition:all .15s;text-align:left;}
.chip.on{background:rgba(232,255,71,.12);border-color:var(--accent);color:var(--accent);}
.chip:active{transform:scale(.97);}
.chips.stack{flex-direction:column;}
.chips.stack .chip{width:100%;padding:15px 18px;line-height:1.45;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px;}
.stat{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:20px 12px;text-align:center;position:relative;overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.04);}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--c,var(--accent));}
.stat-val{font-family:'Syne',sans-serif;font-weight:800;font-size:32px;color:var(--c,var(--accent));line-height:1;margin-bottom:4px;}
.stat-lbl{font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;}
.streak-row{display:flex;gap:8px;margin-bottom:28px;}
.sdot{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .3s;}
.sdot.done{background:rgba(232,255,71,.15);border-color:var(--accent);}
.sdot.today{border-color:var(--blue);animation:pulse 2s ease infinite;}
.sec{font-family:'Syne',sans-serif;font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;}
.track-pills{display:flex;gap:8px;margin-bottom:20px;}
.track-pill{flex:1;background:var(--s1);border:1.5px solid var(--border);border-radius:14px;padding:12px 8px;text-align:center;font-size:12px;color:var(--muted);transition:all .2s;}
.track-pill.on{border-color:var(--c,var(--accent));color:var(--c,var(--accent));background:rgba(232,255,71,.05);}
.track-pill:active{transform:scale(.97);}
.track-pill .tp-icon{display:block;font-size:22px;margin-bottom:4px;}
.ccard{background:var(--s1);border:1px solid var(--border);border-radius:20px;overflow:hidden;margin-bottom:24px;box-shadow:0 12px 32px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.04);}
.ccard-head{padding:22px 20px 18px;background:linear-gradient(135deg,rgba(232,255,71,.07),transparent);border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.ccard-skill{font-size:11px;color:var(--accent);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;}
.ccard-title{font-family:'Syne',sans-serif;font-weight:700;font-size:24px;line-height:1.2;}
.ccard-icon{font-size:36px;flex-shrink:0;margin-top:4px;filter:drop-shadow(0 6px 16px rgba(232,255,71,.3));}
.ccard-body{padding:22px;}
.ccard-text{font-size:16px;line-height:1.75;color:#c0c0d8;margin-bottom:22px;}
.task-box{background:var(--s2);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:22px;}
.task-lbl{font-size:10px;color:var(--blue);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;}
.task-text{font-size:16px;line-height:1.75;}
.ccard-actions{display:flex;gap:10px;}
.btn-complete{flex:1;background:var(--accent);color:#080810;font-family:'Syne',sans-serif;font-weight:700;font-size:16px;letter-spacing:.04em;text-transform:uppercase;border:none;border-radius:14px;padding:18px;transition:all .2s;box-shadow:0 10px 26px rgba(232,255,71,.16);}
.btn-complete:hover{box-shadow:0 6px 20px rgba(232,255,71,.3);transform:translateY(-1px);}
.btn-complete:active{transform:scale(.97);}
.btn-complete:disabled{opacity:.5;transform:none;box-shadow:none;}
.btn-skip{background:var(--s2);border:1.5px solid var(--border);color:var(--muted);font-size:22px;border-radius:14px;padding:18px 22px;transition:all .2s;}
.btn-skip:hover{border-color:var(--blue);color:var(--blue);}
.heat-chip{display:inline-flex;align-items:center;gap:4px;background:rgba(255,107,71,.12);border:1px solid rgba(255,107,71,.35);color:var(--red);font-size:11px;font-weight:600;letter-spacing:.06em;border-radius:20px;padding:4px 10px;margin-top:8px;}
.quiz-q{font-family:'Syne',sans-serif;font-weight:700;font-size:20px;line-height:1.35;margin-bottom:18px;text-wrap:balance;}
.quiz-opts{display:flex;flex-direction:column;gap:10px;margin-bottom:8px;}
.quiz-opt{background:var(--s2);border:1.5px solid var(--border);color:var(--text);border-radius:14px;padding:16px 18px;font-size:15px;line-height:1.45;text-align:left;transition:all .15s;}
.quiz-opt:active{transform:scale(.985);}
.quiz-opt.correct{border-color:var(--green);background:rgba(71,255,170,.12);color:var(--green);}
.quiz-opt.wrong{border-color:var(--red);background:rgba(255,107,71,.1);color:var(--red);}
.quiz-meta{font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:14px;}
.loading{text-align:center;padding:52px 24px;color:var(--muted);font-size:13px;letter-spacing:.08em;}
.spinner{width:30px;height:30px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;margin:0 auto 18px;animation:spin .8s linear infinite;}
.done-state{text-align:center;padding:52px 24px;}
.done-icon{font-size:64px;margin-bottom:18px;animation:pop .4s cubic-bezier(.34,1.56,.64,1) both;filter:drop-shadow(0 0 26px rgba(232,255,71,.5));}
.done-title{font-family:'Syne',sans-serif;font-weight:800;font-size:28px;color:var(--accent);margin-bottom:8px;}
.done-sub{font-size:15px;color:var(--muted);margin-bottom:32px;line-height:1.6;}
.btn-next{background:var(--s2);border:1.5px solid var(--accent);color:var(--accent);font-family:'Syne',sans-serif;font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;border-radius:14px;padding:16px 36px;transition:all .2s;}
.btn-next:hover{background:rgba(232,255,71,.1);}
.btn-next:active{transform:scale(.97);}
.skill-list{display:flex;flex-direction:column;gap:12px;}
.skill-item{background:var(--s1);border:1.5px solid var(--border);border-radius:var(--r);padding:20px 16px;display:flex;align-items:center;gap:14px;transition:all .2s;box-shadow:0 12px 32px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.04);}
.skill-item.active{border-color:var(--accent);background:rgba(232,255,71,.04);}
.skill-item.locked{opacity:.4;}
.skill-item:active{transform:scale(.985);}
.skill-emoji{font-size:30px;flex-shrink:0;}
.skill-info{flex:1;}
.skill-name{font-family:'Syne',sans-serif;font-weight:700;font-size:17px;margin-bottom:3px;}
.skill-desc{font-size:13px;color:var(--muted);}
.skill-badge{font-size:10px;padding:6px 14px;border-radius:20px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;flex-shrink:0;border:none;}
.badge-active{background:rgba(232,255,71,.15);color:var(--accent);}
.badge-done{background:rgba(71,255,170,.15);color:var(--green);}
.badge-locked{background:var(--s2);color:var(--muted);}
.prog-empty{text-align:center;padding:52px 24px;color:var(--muted);font-size:15px;line-height:1.7;}
.prog-item{background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:10px;box-shadow:0 12px 32px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.04);}
.prog-skill{font-size:10px;color:var(--accent);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px;}
.prog-title{font-size:16px;font-weight:500;margin-bottom:4px;}
.prog-date{font-size:13px;color:var(--muted);}
.pin-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:32px 24px;}
.pin-title{font-family:'Syne',sans-serif;font-weight:800;font-size:32px;margin-bottom:8px;}
.pin-sub{font-size:15px;color:var(--muted);margin-bottom:36px;}
.pin-dots{display:flex;gap:16px;margin-bottom:36px;}
.pin-dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);transition:all .2s;}
.pin-dot.filled{background:var(--blue);border-color:var(--blue);}
.pin-pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;}
.pin-key{width:72px;height:72px;border-radius:50%;background:var(--s2);border:1.5px solid var(--border);color:var(--text);font-size:26px;font-weight:500;transition:all .15s;}
.pin-key:active{background:var(--s3);border-color:var(--blue);}
.pin-key.del{font-size:20px;color:var(--muted);}
.forgot-box{margin-top:26px;width:100%;max-width:340px;text-align:center;}
.forgot-box .row{display:flex;gap:8px;margin-top:12px;}
.parent-screen{min-height:100vh;padding:24px 20px 60px;animation:fadeUp .4s ease both;}
.parent-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;}
.parent-wordmark{font-family:'Syne',sans-serif;font-weight:800;font-size:24px;color:var(--blue);letter-spacing:-1px;}
.parent-sub{font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;}
.p-card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:16px;box-shadow:0 12px 32px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.04);}
.p-card-title{font-family:'Syne',sans-serif;font-weight:700;font-size:15px;margin-bottom:16px;}
.p-stat-row{display:flex;gap:12px;margin-bottom:14px;}
.p-stat{flex:1;background:var(--s2);border-radius:12px;padding:14px;text-align:center;}
.p-stat-val{font-family:'Syne',sans-serif;font-weight:800;font-size:24px;color:var(--blue);}
.p-stat-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:2px;}
.p-feed-item{padding:12px 0;border-bottom:1px solid var(--border);}
.p-feed-item:last-child{border-bottom:none;}
.p-feed-skill{font-size:10px;color:var(--accent);letter-spacing:.08em;text-transform:uppercase;}
.p-feed-title{font-size:15px;margin:2px 0;}
.p-feed-date{font-size:12px;color:var(--muted);}
.p-textarea{width:100%;background:var(--s2);border:1.5px solid var(--border);border-radius:12px;padding:14px;color:var(--text);font-size:15px;outline:none;min-height:90px;resize:vertical;margin-bottom:12px;}
.p-textarea:focus{border-color:var(--blue);}
.btn-parent{width:100%;background:var(--blue);color:#080810;font-family:'Syne',sans-serif;font-weight:700;font-size:15px;border:none;border-radius:12px;padding:14px;transition:all .2s;}
.btn-parent:disabled{opacity:.4;}
.btn-danger{width:100%;background:none;border:1.5px solid var(--red);color:var(--red);font-size:14px;font-weight:600;border-radius:12px;padding:12px;transition:all .2s;}
.admin-note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:10px;}
.mini-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
.mini-chip{background:var(--s2);border:1.5px solid var(--border);color:var(--muted);border-radius:10px;padding:8px 12px;font-size:13px;transition:all .15s;}
.mini-chip.on{border-color:var(--blue);color:var(--blue);background:rgba(71,200,255,.08);}
.preview-box{background:var(--s2);border:1px solid var(--border);border-radius:12px;padding:14px;font-size:14px;line-height:1.6;margin-top:4px;}
.preview-box .pv-lbl{font-size:10px;color:var(--blue);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;}
.ai-messages{display:flex;flex-direction:column;gap:10px;max-height:320px;overflow-y:auto;margin-bottom:14px;}
.ai-msg{padding:12px 16px;border-radius:14px;font-size:15px;line-height:1.6;white-space:pre-wrap;}
.ai-msg.user{background:rgba(71,200,255,.12);border:1px solid rgba(71,200,255,.25);align-self:flex-end;max-width:85%;}
.ai-msg.assistant{background:var(--s2);border:1px solid var(--border);align-self:flex-start;max-width:92%;}
.ai-input-row{display:flex;gap:8px;}
.ai-input{flex:1;background:var(--s2);border:1.5px solid var(--border);border-radius:12px;padding:14px 16px;color:var(--text);font-size:15px;outline:none;}
.ai-input:focus{border-color:var(--blue);}
.btn-send{background:var(--blue);color:#080810;border:none;border-radius:12px;padding:14px 18px;font-size:20px;transition:all .2s;}
.btn-send:disabled{opacity:.4;}
.mentor-card{background:linear-gradient(135deg,rgba(200,71,255,.1),rgba(71,200,255,.06));border:1px solid rgba(200,71,255,.3);border-radius:20px;padding:20px;margin-bottom:20px;display:flex;gap:14px;align-items:center;box-shadow:0 12px 32px rgba(0,0,0,.38);}
.mentor-face{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--blue));display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;box-shadow:0 0 24px rgba(200,71,255,.35);}
.mentor-name{font-family:'Syne',sans-serif;font-weight:700;font-size:17px;margin-bottom:2px;}
.mentor-line{font-size:13px;color:var(--muted);line-height:1.5;}
.legal{font-size:11px;color:var(--muted);text-align:center;line-height:1.7;margin-top:18px;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(71,200,255,.4)}50%{box-shadow:0 0 0 8px rgba(71,200,255,0)}}
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
const { useState, useEffect, useRef } = React;

// ── CONFIG ──────────────────────────────────────────────────────────────────
// AI_ENDPOINT: a serverless proxy that forwards {system, messages, max_tokens}
// to the Anthropic API with YOUR key kept server-side. Leave null and the app
// runs 100% free/offline from the built-in challenge bank.
// See docs/FORGE-V2-PLAN.md for the ready-to-paste Vercel function.
const AI_ENDPOINT = null; // e.g. "/api/mentor"
const AI_MODEL = "claude-haiku-4-5-20251001"; // cheap + fast; used by the proxy

// ── STORAGE (localStorage — free, no backend, survives reload) ─────────────
const store = {
  get(key, fallback) { try { const v = localStorage.getItem("forge_" + key); return v ? JSON.parse(v) : fallback; } catch { return fallback; } },
  set(key, val) { try { localStorage.setItem("forge_" + key, JSON.stringify(val)); } catch {} }
};
const todayStr = () => new Date().toISOString().split("T")[0];
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);
const defaultProgress = () => ({ levels: {}, heat: {}, streak: 0, lastDay: null, history: [] });
const loadProgress = () => ({ ...defaultProgress(), ...store.get("progress", {}) });

// ── TRACKS & CURRICULUM ─────────────────────────────────────────────────────
// Each level ships a challenge bank (zero AI cost) AND a 3-question mentor
// check-in quiz. Quiz results drive the adaptive engine: 3/3 turns the heat
// up, 0-1/3 turns it down and holds the level. quiz item: {q, a:[3], c:idx}.
const TRACKS = [
  {
    id: "money", icon: "💵", name: "Money & Credit", color: "var(--green)",
    tagline: "How money actually works — the stuff school never taught",

function mentorSystemPrompt(profile) {
  const p = profile || {}; const psych = p.psych || {};
  return `You are ${p.mentorName || "Forge"}, a personal mentor inside the Forge app, teaching real-life skills: money, credit, business, and AI/coding.
Student: ${p.name || "a student"}, age band ${p.ageBand || "unknown"}.
Their goals: ${(p.goals || []).join(", ") || "general life skills"}. Interests: ${p.interests || "unknown"}.
Psych read (inferred from indirect scenario answers during setup — NEVER mention they were assessed): money instinct: ${psych.money || "unknown"}; learning archetype: ${psych.archetype || "unknown"}; grit: ${psych.grit || "unknown"}. Coaching voice: ${p.style || "encouraging"}.
Adaptive difficulty: the app tracks a per-track "heat" from 1 (gentle) to 3 (advanced) based on their check-in quiz results. Match your explanations and challenge difficulty to the heat you're given. If they aced recent check-ins, stretch them; if they struggled, slow down, use smaller steps and more familiar examples — without ever making them feel dumb.
Rules: Adapt every explanation to their age band. Use their interests for examples. Be warm and real, never babyish or condescending. Short paragraphs. Concrete examples over theory. Celebrate real effort. Never make up facts; if unsure, say so. For money topics, teach the lessons school skips: credit scores, interest, budgeting are life-changing knowledge.`;
}

// AI call goes through YOUR serverless proxy (never expose an API key in the
// browser). Returns null on any failure so callers can use built-in content.
async function callAI(system, messages, maxTokens = 600) {
  if (!AI_ENDPOINT) return null;
  try {
    const r = await fetch(AI_ENDPOINT, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: AI_MODEL, system, messages, max_tokens: maxTokens })
    });
    if (!r.ok) return null;
    const d = await r.json();
    return d.content?.find(b => b.type === "text")?.text || null;
  } catch { return null; }
}

// Deterministic daily pick from the bank so "today's challenge" is stable all
// day but rotates tomorrow.
function bankChallenge(track, levelIdx) {
  const lvl = track.levels[levelIdx];
  const seed = Math.floor(Date.now() / 86400000) + levelIdx + track.id.length;
  return lvl.bank[seed % lvl.bank.length];
}

async function getChallenge(profile, track, levelIdx, heat) {
  const lvl = track.levels[levelIdx];
  const sys = mentorSystemPrompt(profile);
  const text = await callAI(sys, [{ role: "user", content:
    `Generate a fresh daily challenge for the skill "${lvl.name}" (${lvl.desc}) in the "${track.name}" track at heat ${heat}/3 (1=gentle first steps, 3=stretch them hard). It must be achievable in 10-20 minutes with no money spent. Respond ONLY with JSON, no markdown: {"title":"max 6 words","explanation":"2-3 sentences, warm, specific to their age and interests","task":"one specific concrete task"}` }]);
  if (text) { try { return JSON.parse(text.replace(/```json|```/g, "").trim()); } catch {} }
  return bankChallenge(track, levelIdx);
}

  const [challenge, setChallenge] = useState(null);
  const [loading, setLoading] = useState(false);
  // phase: challenge → quiz → result
  const [phase, setPhase] = useState("challenge");
  const [qIdx, setQIdx] = useState(0);
  const [qScore, setQScore] = useState(0);
  const [qPicked, setQPicked] = useState(null);
  const [result, setResult] = useState(null);

  const track = TRACKS.find(t => t.id === trackId) || TRACKS[0];
  const level = progress.levels[trackId] || 0;
  const heat = progress.heat[trackId] || 1;

  const saveProgress = (p) => { store.set("progress", p); setProgress(p); };
  const switchTrack = (id) => { store.set("track", id); setTrackId(id); setChallenge(null); setPhase("challenge"); };

  useEffect(() => { loadChallenge(); }, [trackId]);

  const loadChallenge = async () => {
    setLoading(true); setPhase("challenge"); setResult(null);
    const t = TRACKS.find(x => x.id === trackId) || TRACKS[0];
    const prog = loadProgress();
    const c = await getChallenge(profile, t, (prog.levels[trackId] || 0), (prog.heat[trackId] || 1));
    setChallenge(c); setLoading(false);
  };

  const handleComplete = () => {
    // Streak + history recorded on completion; the check-in decides progression
    const today = todayStr();
    const alreadyToday = progress.lastDay === today;
    let streak = progress.streak;
    if (!alreadyToday) streak = progress.lastDay && daysBetween(progress.lastDay, today) === 1 ? streak + 1 : 1;
    const history = [{ track: track.name, skill: track.levels[level].name, title: challenge?.title || "", date: today }, ...progress.history].slice(0, 200);
    saveProgress({ ...progress, streak, lastDay: today, history });
    setQIdx(0); setQScore(0); setQPicked(null); setPhase("quiz");
  };

  const answerQuiz = (i) => {
    if (qPicked !== null) return;
    const correct = track.levels[level].quiz[qIdx].c === i;
    setQPicked(i);
    setTimeout(() => {
      const score = qScore + (correct ? 1 : 0);
      setQScore(score); setQPicked(null);
      if (qIdx < 2) { setQIdx(qIdx + 1); return; }
      // ── Adaptive engine ──
      const prog = loadProgress();
      const h = prog.heat[trackId] || 1;
      let newHeat = h, advanced = false, msg;
      if (score === 3) {
        newHeat = Math.min(3, h + 1); advanced = true;
        msg = newHeat > h ? "3/3 — you're ahead of this. Turning up the heat. 🔥" : "3/3 — flawless. You've mastered this level.";
      } else if (score === 2) {
        advanced = true;
        msg = "2/3 — solid. You've got this, moving on.";
      } else {
        newHeat = Math.max(1, h - 1);
        msg = "This one hasn't clicked yet — no stress, that's what mentors are for. We'll come at it from a fresh angle. Same level, new challenge tomorrow.";
      }
      prog.heat = { ...prog.heat, [trackId]: newHeat };
      if (advanced) prog.levels = { ...prog.levels, [trackId]: Math.min(level + 1, track.levels.length - 1) };
      saveProgress(prog);
      setResult({ score, msg, advanced, mastered: advanced && level >= track.levels.length - 1 });
      setPhase("result");
    }, 750);
  };

  const completedCount = progress.history.length;
  const doneToday = progress.lastDay === todayStr();
  const streakDots = Array.from({ length: 7 }, (_, i) => {

    <>

        <div className="screen">
          <div className="topbar">
            <div className="wordmark">FORGE</div>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <div className="avatar">{initial}</div>
              <button className="btn-ghost-sm" onClick={onParent}>parent</button>
            </div>
          </div>

          <div className="mentor-card" onClick={() => setTab("mentor")}>
            <div className="mentor-face">🧭</div>
            <div>
              <div className="mentor-name">Your mentor</div>
              <div className="mentor-line">{doneToday ? `Streak safe, ${profile?.name}. Come back tomorrow — or get ahead on another track.` : `Ready when you are, ${profile?.name}. Today's ${track.name} challenge is waiting.`}</div>
            </div>
          </div>

          <div className="stats">
            <div className="stat" style={{"--c":"var(--accent)"}}><div className="stat-val">{progress.streak}</div><div className="stat-lbl">Streak 🔥</div></div>
            <div className="stat" style={{"--c":"var(--blue)"}}><div className="stat-val">{completedCount}</div><div className="stat-lbl">Done</div></div>
            <div className="stat" style={{"--c":"var(--red)"}}><div className="stat-val">{level + 1}/{track.levels.length}</div><div className="stat-lbl">Level</div></div>
          </div>

          <div className="sec">This week</div>
          <div className="streak-row">{streakDots.map((t, i) => <div key={i} className={`sdot ${t}`}>{t === "done" ? "✓" : t === "today" ? "→" : ""}</div>)}</div>

          <div className="sec">Your tracks</div>
          <div className="track-pills">
            {TRACKS.map(t => (
              <button key={t.id} className={`track-pill ${t.id === trackId ? "on" : ""}`} style={{"--c": t.color}} onClick={() => switchTrack(t.id)}>
                <span className="tp-icon" aria-hidden="true">{t.icon}</span>{t.name}
              </button>
            ))}
          </div>

          <div className="skill-item active" style={{marginBottom:0}}>
            <div className="skill-emoji" aria-hidden="true">{track.levels[level].icon}</div>
            <div className="skill-info"><div className="skill-name">{track.levels[level].name}</div><div className="skill-desc">{track.levels[level].desc}</div></div>
            <button className="skill-badge badge-active" onClick={() => setTab("challenge")}>Go →</button>
          </div>
        </div>
      )}

      {tab === "challenge" && (
        <div className="screen">
          <div className="topbar"><div className="wordmark">FORGE</div><div className="avatar">{initial}</div></div>
          <div className="ccard">
            {loading && <div className="loading"><div className="spinner"/>building your challenge...</div>}

            {!loading && phase === "challenge" && challenge && (
              <>
                <div className="ccard-head">
                  <div>
                    <div className="ccard-skill">{track.name} · {track.levels[level].name}</div>

                    <button className="btn-skip" onClick={loadChallenge} disabled={loading} aria-label="Get a different challenge" title="Different challenge">↺</button>
                  </div>

function MentorChat({ profile, track, level, heat, initial }) {
  const greeting = AI_ENDPOINT
    ? `Hey ${profile?.name}! I'm your mentor. Ask me anything — today's challenge, money stuff, business ideas, AI, whatever you're stuck on or curious about.`
    : `Hey ${profile?.name}! I'm your mentor. Live chat needs the AI connection set up (a grown-up can do it in 5 minutes — see the setup guide). Until then, your daily challenges below still work 100%.`;
  const [messages, setMessages] = useState([{ role: "assistant", content: greeting }]);
  const [input, setInput] = useState("");
  const [busy, setBusy] = useState(false);
  const endRef = useRef(null);
  useEffect(() => { endRef.current?.scrollIntoView({ behavior: "smooth" }); }, [messages]);

  const send = async () => {
    if (!input.trim() || busy) return;
    const msg = input.trim(); setInput("");
    const next = [...messages, { role: "user", content: msg }];
    setMessages(next); setBusy(true);
    const sys = mentorSystemPrompt(profile) + `\nThey are currently on the "${track.name}" track, level "${track.levels[level].name}", heat ${heat}/3.`;
    const text = await callAI(sys, next.filter((m, i) => i > 0).map(m => ({ role: m.role, content: m.content })), 500);
    setMessages(m => [...m, { role: "assistant", content: text || "I can't connect right now — but your challenges still work! Ask a parent to check the AI setup when they get a chance." }]);
    setBusy(false);
  };

  return (
    <div className="screen">
      <div className="topbar"><div className="wordmark">FORGE</div><div className="avatar">{initial}</div></div>
      <div className="mentor-card"><div className="mentor-face" aria-hidden="true">🧭</div><div>
        <div className="mentor-name">Your Mentor</div>
        <div className="mentor-line">Tuned to you: {profile?.ageBand}{profile?.psych?.archetype && profile.psych.archetype !== "unknown" ? ` · ${profile.psych.archetype}` : ""}{profile?.interests ? ` · loves ${profile.interests}` : ""} · 🔥 {HEAT_LABELS[heat]}</div>
      </div></div>
      <div className="ai-messages" style={{maxHeight: "none", flex: 1}}>
        {messages.map((m, i) => <div key={i} className={`ai-msg ${m.role}`}>{m.content}</div>)}
        {busy && <div className="ai-msg assistant" style={{color:"var(--muted)"}}>thinking...</div>}
        <div ref={endRef}/>
      </div>
      <div className="ai-input-row">
        <input className="ai-input" aria-label="Message your mentor" placeholder="Ask your mentor anything..." value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === "Enter" && send()} />
        <button className="btn-send" aria-label="Send message" onClick={send} disabled={!input.trim() || busy}>→</button>
      </div>
    </div>
  );
}

function PinScreen({ profile, onProfile, onSuccess, onBack }) {
  const pin = (profile && profile.parentPin) || "1234";
  const [entered, setEntered] = useState("");
  const [err, setErr] = useState(false);
  const [forgot, setForgot] = useState(false);
  const [word, setWord] = useState("");
  const [wordErr, setWordErr] = useState("");

  const press = (k) => {
    if (k === "del") { setEntered(p => p.slice(0, -1)); setErr(false); return; }
    if (entered.length >= 4) return;
    const np = entered + k; setEntered(np);
    if (np.length === 4) {
      if (np === pin) setTimeout(onSuccess, 200);
      else setTimeout(() => { setEntered(""); setErr(true); }, 300);
    }
  };

  const tryRecover = () => {
    if (!profile?.recoveryWord) { setWordErr("No recovery word was set. Reset it from the parent portal next time you're in."); return; }
    if (word.trim().toLowerCase() === profile.recoveryWord.toLowerCase()) {
      onProfile({ ...profile, parentPin: "1234" });
      onSuccess();
    } else setWordErr("That's not the recovery word.");
  };

  return (
    <div className="pin-screen">
      <div className="pin-title">Parent Access</div>
      <div className="pin-sub" style={{color: err ? "var(--red)" : "var(--muted)"}}>{err ? "Incorrect PIN. Try again." : "Enter your PIN"}</div>
      <div className="pin-dots">{[0,1,2,3].map(i => <div key={i} className={`pin-dot ${i < entered.length ? "filled" : ""}`}/>)}</div>
      <div className="pin-pad">
        {["1","2","3","4","5","6","7","8","9","","0","del"].map((k, i) => (
          k === "" ? <div key={i}/> : <button key={i} className={`pin-key ${k === "del" ? "del" : ""}`} onClick={() => press(k)} aria-label={k === "del" ? "Delete digit" : k}>{k === "del" ? "⌫" : k}</button>
        ))}
      </div>
      {!forgot
        ? <button className="btn-ghost-sm" style={{marginTop: 26}} onClick={() => setForgot(true)}>Forgot PIN?</button>
        : (
          <div className="forgot-box">
            <div style={{fontSize:14, color:"var(--muted)"}}>Enter your recovery word to reset the PIN to 1234.</div>
            <div className="row">
              <input className="ai-input" aria-label="Recovery word" placeholder="Recovery word" value={word} onChange={e => { setWord(e.target.value); setWordErr(""); }} onKeyDown={e => e.key === "Enter" && tryRecover()} />
              <button className="btn-send" style={{fontSize:14, fontWeight:600}} onClick={tryRecover}>Reset</button>
            </div>
            {wordErr && <div className="err">{wordErr}</div>}
          </div>
        )}
      <button className="btn-ghost-sm" style={{marginTop: 20}} onClick={onBack}>← Back</button>
    </div>
  );
}

function ParentPortal({ profile, onProfile, onExit }) {
  const [progress, setProgress] = useState(loadProgress);
  const [newPin, setNewPin] = useState("");
  const [pinSaved, setPinSaved] = useState(false);
  const [recWord, setRecWord] = useState(profile?.recoveryWord || "");
  const [recSaved, setRecSaved] = useState(false);
  // Admin test mode
  const [tTrack, setTTrack] = useState("money");
  const [tLevel, setTLevel] = useState(0);
  const [confirmReset, setConfirmReset] = useState(false);
  const [aiMessages, setAiMessages] = useState([
    { role: "assistant", content: `Hi! I'm here to help you support ${profile?.name || "your learner"}. Ask what they should work on next, how to explain something (credit scores, budgeting, AI), or for custom challenge ideas.${AI_ENDPOINT ? "" : "\n\n(Live AI chat is off — set AI_ENDPOINT in the app config to enable it. The rest of the portal works.)"}` }
  ]);
  const [aiInput, setAiInput] = useState("");
  const [aiLoading, setAiLoading] = useState(false);
  const endRef = useRef(null);
  useEffect(() => { endRef.current?.scrollIntoView({ behavior: "smooth" }); }, [aiMessages]);

  const previewTrack = TRACKS.find(t => t.id === tTrack);
  const previewLvl = previewTrack.levels[tLevel];
  const previewChallenge = bankChallenge(previewTrack, tLevel);

  const savePin = () => {
    if (!/^\d{4}$/.test(newPin)) return;
    onProfile({ ...profile, parentPin: newPin });
    setNewPin(""); setPinSaved(true); setTimeout(() => setPinSaved(false), 2000);
  };
  const saveRec = () => {
    onProfile({ ...profile, recoveryWord: recWord.trim() });
    setRecSaved(true); setTimeout(() => setRecSaved(false), 2000);
  };
  const setHeat = (h) => {
    const prog = loadProgress();
    prog.heat = { ...prog.heat, [tTrack]: h };
    store.set("progress", prog); setProgress(prog);
  };
  const resetAll = () => {
    if (!confirmReset) { setConfirmReset(true); setTimeout(() => setConfirmReset(false), 4000); return; }
    try { localStorage.removeItem("forge_progress"); localStorage.removeItem("forge_track"); localStorage.removeItem("forge_profile"); } catch {}
    location.reload();
  };

  const sendAi = async () => {
    if (!aiInput.trim() || aiLoading) return;
    const msg = aiInput.trim(); setAiInput("");
    const next = [...aiMessages, { role: "user", content: msg }];
    setAiMessages(next); setAiLoading(true);
    const sys = `You are an assistant for a parent supporting ${profile?.name || "their child"} (age band ${profile?.ageBand}) learning life skills in the Forge app (tracks: Money & Credit, Business, AI Skills). They have completed ${progress.history.length} challenges, current streak ${progress.streak}. Goals: ${(profile?.goals || []).join(", ")}. Psych read: ${JSON.stringify(profile?.psych || {})}. Give practical, specific, concise parent-friendly advice.`;
    const text = await callAI(sys, next.filter((m, i) => i > 0).map(m => ({ role: m.role, content: m.content })), 500);
    setAiMessages(m => [...m, { role: "assistant", content: text || "AI isn't connected yet. Set AI_ENDPOINT in the app (see docs/FORGE-V2-PLAN.md) to enable live help." }]);
    setAiLoading(false);
  };

  return (
    <div className="parent-screen">
      <div className="parent-header">
        <div><div className="parent-wordmark">FORGE</div><div className="parent-sub">Parent Portal</div></div>
        <button className="btn-ghost-sm" onClick={onExit}>exit</button>
      </div>

      <div className="p-card">
        <div className="p-card-title">📊 {profile?.name}'s Progress</div>
        <div className="p-stat-row">
          <div className="p-stat"><div className="p-stat-val">{progress.streak}</div><div className="p-stat-lbl">Streak</div></div>
          <div className="p-stat"><div className="p-stat-val">{progress.history.length}</div><div className="p-stat-lbl">Done</div></div>
          <div className="p-stat"><div className="p-stat-val">{Object.keys(progress.levels).length || 1}</div><div className="p-stat-lbl">Tracks</div></div>
        </div>
        <div style={{fontSize:14,color:"var(--muted)"}}>Mentor profile: {profile?.ageBand} · {(profile?.goals || []).join(", ")}{profile?.psych?.archetype && profile.psych.archetype !== "unknown" ? ` · reads as: ${profile.psych.archetype}, grit ${profile.psych.grit}` : ""}</div>
      </div>

      <div className="p-card">
        <div className="p-card-title">🕐 Recent Activity</div>
        {progress.history.length === 0
          ? <div style={{fontSize:14,color:"var(--muted)"}}>Nothing completed yet.</div>
          : progress.history.slice(0, 8).map((a, i) => (
            <div key={i} className="p-feed-item">
              <div className="p-feed-skill">{a.track} · {a.skill}</div>
              <div className="p-feed-title">{a.title}</div>
              <div className="p-feed-date">{a.date}</div>
            </div>
          ))}
      </div>

      <div className="p-card">
        <div className="p-card-title">🧪 Admin · Test Mode</div>
        <div className="mini-chips">{TRACKS.map(t => <button key={t.id} className={`mini-chip ${tTrack === t.id ? "on" : ""}`} onClick={() => { setTTrack(t.id); setTLevel(0); }}>{t.icon} {t.name}</button>)}</div>
        <div className="mini-chips">{previewTrack.levels.map((l, i) => <button key={l.id} className={`mini-chip ${tLevel === i ? "on" : ""}`} onClick={() => setTLevel(i)}>L{i + 1}</button>)}</div>
        <div className="preview-box">
          <div className="pv-lbl">{previewLvl.name} — today's bank challenge</div>
          <b>{previewChallenge.title}</b> — {previewChallenge.task}
          <div className="pv-lbl" style={{marginTop:10}}>Check-in Q1</div>
          {previewLvl.quiz[0].q} <span style={{color:"var(--green)"}}>✓ {previewLvl.quiz[0].a[previewLvl.quiz[0].c]}</span>
        </div>
        <div className="pv-lbl" style={{margin:"12px 0 6px",fontSize:10,letterSpacing:".1em",textTransform:"uppercase",color:"var(--blue)"}}>Mentor heat for {previewTrack.name}: {HEAT_LABELS[progress.heat[tTrack] || 1]}</div>
        <div className="mini-chips">{[1,2,3].map(h => <button key={h} className={`mini-chip ${(progress.heat[tTrack] || 1) === h ? "on" : ""}`} onClick={() => setHeat(h)}>🔥 {HEAT_LABELS[h]}</button>)}</div>
        <div className="admin-note">Test mode previews any level's content and overrides the adaptive difficulty. In the multi-user version this becomes your admin dashboard — aggregate stats and synthetic test users only, no browsing real users' data (privacy/COPPA).</div>
        <button className="btn-danger" style={{marginTop:12}} onClick={resetAll}>{confirmReset ? "Tap again to erase EVERYTHING" : "Reset all app data…"}</button>
      </div>

      <div className="p-card">
        <div className="p-card-title">🔐 Security</div>
        <div className="field-label" style={{marginBottom:6}}>Change parent PIN</div>
        <div style={{display:"flex",gap:10,marginBottom:16}}>
          <input className="ai-input" aria-label="New 4-digit PIN" placeholder="New 4-digit PIN" inputMode="numeric" maxLength={4} value={newPin} onChange={e => setNewPin(e.target.value.replace(/\D/g, ""))}/>
          <button className="btn-send" style={{fontSize:14,fontWeight:600}} onClick={savePin} disabled={!/^\d{4}$/.test(newPin)}>{pinSaved ? "✓" : "Save"}</button>
        </div>
        <div className="field-label" style={{marginBottom:6}}>Recovery word (unlocks a forgotten PIN)</div>
        <div style={{display:"flex",gap:10}}>
          <input className="ai-input" aria-label="Recovery word" placeholder="e.g. your first pet's name" value={recWord} onChange={e => setRecWord(e.target.value)}/>
          <button className="btn-send" style={{fontSize:14,fontWeight:600}} onClick={saveRec} disabled={!recWord.trim()}>{recSaved ? "✓" : "Save"}</button>
        </div>
        <div className="admin-note">Full password accounts + email reset arrive with Supabase Auth in forge-next (see docs/FORGE-V2-PLAN.md §2).</div>
      </div>

      <div className="p-card">
        <div className="p-card-title">🤖 AI Assistant</div>
        <div className="ai-messages">
          {aiMessages.map((m, i) => <div key={i} className={`ai-msg ${m.role}`}>{m.content}</div>)}
          {aiLoading && <div className="ai-msg assistant" style={{color:"var(--muted)"}}>thinking...</div>}
          <div ref={endRef}/>
        </div>
        <div className="ai-input-row">
          <input className="ai-input" aria-label="Ask the AI assistant" placeholder={`Ask about ${profile?.name}'s learning...`} value={aiInput} onChange={e => setAiInput(e.target.value)} onKeyDown={e => e.key === "Enter" && sendAi()}/>
          <button className="btn-send" aria-label="Send message" onClick={sendAi} disabled={!aiInput.trim() || aiLoading}>→</button>
        </div>
      </div>
    </div>
  );
}

const domRoot = ReactDOM.createRoot(document.getElementById('root'));
domRoot.render(React.createElement(ForgeApp));
  </script>
</body>
</html>
